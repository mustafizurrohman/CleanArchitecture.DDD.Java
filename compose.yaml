services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cleanarchitecture
      POSTGRES_USER: cleanarchitecture
      POSTGRES_PASSWORD: cleanarchitecture
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanarchitecture -d cleanarchitecture"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cleanarchitecture-postgres:/var/lib/postgresql

volumes:
  cleanarchitecture-postgres:
